    <rect x="452" y="742" width="140" height="40" rx="20" fill="#141a31" stroke="#2b3358" stroke-width="1.5"/>
    <text x="522" y="767" fill="#f4f6fb" text-anchor="middle">3 agents</text>
    <rect x="608" y="742" width="160" height="40" rx="20" fill="#141a31" stroke="#2b3358" stroke-width="1.5"/>
    <text x="688" y="767" fill="#f4f6fb" text-anchor="middle">5 commands</text>
    <rect x="784" y="742" width="120" height="40" rx="20" fill="#141a31" stroke="#E5B567" stroke-width="1.5"/>

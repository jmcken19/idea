    <rect x="616" y="652" width="180" height="34" rx="8" fill="#141a31" stroke="#2b3358" stroke-width="1.5"/>
    <text x="706" y="675" fill="#f4f6fb" text-anchor="middle" font-size="16">paste-ready</text>
